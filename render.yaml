# Render Blueprint — deploy game + multiplayer together.
# https://render.com/docs/blueprint-spec
#
# Setup: Render Dashboard → New → Blueprint → connect repo → branch deploy/render

services:
  # Socket.io backend (listed first; game service reads its URL via fromService)
  - type: web
    name: mattie-run-multiplayer
    runtime: node
    region: singapore
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAX_PLAYERS
        value: "300"

  # Next.js game (/, /single, /host) + runtime config API
  - type: web
    name: mattie-run
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_MULTIPLAYER_URL
        fromService:
          type: web
          name: mattie-run-multiplayer
          envVarKey: RENDER_EXTERNAL_URL
      - key: MULTIPLAYER_SERVER_URL
        fromService:
          type: web
          name: mattie-run-multiplayer
          envVarKey: RENDER_EXTERNAL_URL
